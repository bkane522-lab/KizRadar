<style>
:root{
  --ink:#05030a; --ink2:#0b0616; --ink3:#130c22;
  --violet:#7B2FF7; --violet-soft:#A472FF;
  --gold:#E8B84B; --turq:#2FE0C8; --rasp:#E11D48;
  --paper:#F4EFFF; --muted:#948AB0; --line:rgba(164,114,255,.16);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --head-h:60px; --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--paper);
  font-family:var(--body); font-size:15px; line-height:1.5;
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 70% at 12% -8%, rgba(123,47,247,.30), transparent 62%),
    radial-gradient(90% 60% at 92% 4%, rgba(232,184,75,.13), transparent 58%),
    radial-gradient(110% 70% at 50% 108%, rgba(47,224,200,.11), transparent 62%);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--turq);outline-offset:3px;border-radius:6px}

/* Fond d'ambiance réservé à l'écran de quiz. Se fond en douceur, disparaît
   ailleurs. Si quiz-bg.jpg manque, il ne se passe simplement rien. */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70% 45% at 82% 8%,rgba(123,47,247,.22),transparent 62%),
             radial-gradient(60% 40% at 15% 92%,rgba(47,224,200,.10),transparent 60%);
  opacity:0;transition:opacity .55s ease;
}
body[data-page="quiz"]::after{opacity:1}
@media (prefers-reduced-motion:reduce){ body::after{transition:none} }

/* ---------- shell ---------- */
.shell{
  position:relative; z-index:1;
  max-width:520px; margin:0 auto;
  padding:calc(var(--head-h) + var(--safe-t) + 14px) 18px calc(var(--nav-h) + var(--safe-b) + 26px);
  min-height:100dvh;
}

/* ---------- header ---------- */
.head{
  position:fixed; top:0; left:0; right:0; z-index:40;
  height:calc(var(--head-h) + var(--safe-t));
  padding:var(--safe-t) 16px 0;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(180deg,rgba(5,3,10,.96),rgba(5,3,10,.78) 70%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.mark img{width:100%;height:100%;display:block;border-radius:9px;filter:drop-shadow(0 3px 10px rgba(232,184,75,.35))}
.head-id{flex:1;min-width:0}
.head-id b{
  display:block;font-family:var(--display);font-weight:800;font-size:14px;
  letter-spacing:.02em;line-height:1.1;font-stretch:92%;
}
.head-id span{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.xp-chip{
  display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
  background:rgba(232,184,75,.10);border:1px solid rgba(232,184,75,.28);
  font-family:var(--mono);font-size:11.5px;color:var(--gold);white-space:nowrap;
}
.lang{display:flex;gap:2px;padding:2px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.03)}
.lang button{
  padding:5px 9px;border-radius:999px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;color:var(--muted);line-height:1;
}
.lang button[aria-pressed="true"]{background:rgba(123,47,247,.30);color:var(--paper)}
.nav button em{font-style:normal}
.q-note{
  display:inline-block;font-size:10px;letter-spacing:.08em;color:var(--muted);
  border:1px dashed var(--line);border-radius:999px;padding:4px 10px;margin-bottom:12px;
}
.snd{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  display:grid;place-items:center;font-size:14px;
}
.snd[aria-pressed="true"]{border-color:rgba(47,224,200,.5);background:rgba(47,224,200,.12)}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:flex;
  background:linear-gradient(0deg,rgba(5,3,10,.98) 60%,rgba(5,3,10,.86));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding-top:4px;
}
.nav button i{font-style:normal;font-size:17px;line-height:1;opacity:.62;transition:.2s}
.nav button[aria-current="page"]{color:var(--paper)}
.nav button[aria-current="page"] i{opacity:1;transform:translateY(-1px)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;top:0;width:26px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--violet),var(--turq));
}
.nav button{position:relative}

/* ---------- type ---------- */
.eyebrow{
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--violet-soft);
  margin:0 0 8px;font-weight:600;
}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(30px,9vw,40px);line-height:.98;font-stretch:88%}
h2{font-size:20px;line-height:1.12}
h3{font-size:15px;line-height:1.2;font-weight:700}
p{margin:0 0 12px;color:var(--muted)}
.num{font-family:var(--mono)}

/* ---------- hero : ligne de tempo ---------- */
.hero{
  position:relative;border-radius:22px;overflow:hidden;
  padding:26px 20px 22px;margin-bottom:16px;
  background:
    linear-gradient(180deg,rgba(5,3,10,.28),rgba(5,3,10,.55) 46%,rgba(5,3,10,.90)),
    linear-gradient(155deg,rgba(123,47,247,.26),rgba(11,6,22,.7) 52%,rgba(47,224,200,.10)),
    var(--ink2);
  border:1px solid var(--line);
}
/* Le dégradé passe TOUJOURS avant l'image, et un fond uni ferme la pile :
   si un JPEG manque, l'écran reste correct au lieu de casser. */
.skin{position:relative;border-radius:20px;overflow:hidden;padding:18px 16px;margin:0 0 14px}
.skin h2{margin:0}
.skin-results{
  padding:20px 16px 8px;
  background:
    linear-gradient(180deg,rgba(5,3,10,.30),rgba(5,3,10,.60) 70%,rgba(5,3,10,.72)), var(--ink2)}
.skin-results .score-ring{margin:4px auto 10px}
.skin-cards{background:
  linear-gradient(180deg,rgba(5,3,10,.12),rgba(5,3,10,.35) 70%,rgba(5,3,10,.45)), var(--ink2)}
.crest{
  display:block;width:min(62%,220px);height:auto;margin:0 auto 14px;
  filter:drop-shadow(0 10px 30px rgba(232,184,75,.22));
}
.hero h1{margin-bottom:10px}
.hero h1 em{font-style:normal;display:block;color:var(--gold);font-size:.55em;letter-spacing:.32em;font-weight:700;margin-bottom:6px}
.hero p{margin-bottom:18px;font-size:14px;max-width:34ch}
.tempo{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.tempo-track{
  position:relative;flex:1;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(164,114,255,.35),rgba(47,224,200,.22));
  overflow:hidden;
}
.tempo-track::after{
  content:"";position:absolute;top:-2px;left:0;width:34px;height:6px;border-radius:6px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:sweep 2.82s linear infinite; /* ~85 bpm, 4 temps */
}
.tempo-lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.1em}
@keyframes sweep{from{transform:translateX(-40px)}to{transform:translateX(520px)}}

/* ---------- niveau ---------- */
.level-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.level-badge{
  width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;
  font-size:20px;background:rgba(232,184,75,.10);border:1px solid rgba(232,184,75,.3);
}
.level-name{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
.level-next{font-size:11.5px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- boutons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:14px;font-weight:600;font-size:15px;
  background:linear-gradient(100deg,var(--violet),#5B18C9);
  box-shadow:0 8px 22px rgba(123,47,247,.32);
  transition:transform .12s ease;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none;color:var(--paper)}
.btn.gold{background:linear-gradient(100deg,var(--gold),#C99527);color:#22160a;box-shadow:0 8px 22px rgba(232,184,75,.24)}
.btn.danger{background:none;border:1px solid rgba(225,29,72,.4);color:#FF8FA6;box-shadow:none;min-height:46px;font-size:13.5px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin:0}

/* ---------- cartes générales ---------- */
.panel{
  background:var(--ink2);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:12px;
}
.stat-row{display:flex;gap:9px;margin-bottom:16px}
.stat{
  flex:1;background:var(--ink2);border:1px solid var(--line);border-radius:14px;
  padding:12px 10px;text-align:center;
}
.stat b{display:block;font-family:var(--mono);font-size:19px;color:var(--gold);line-height:1.1}
.stat span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- packs ---------- */
.pack{
  display:block;width:100%;text-align:left;position:relative;
  /* Un seul bandeau, désaturé, teinté différemment pour chaque pack.
     Le voile va de 95 % à gauche (le texte) à 50 % à droite (la lueur). */
  background:
    linear-gradient(90deg,rgba(5,3,10,.95) 20%,rgba(5,3,10,.72) 68%,rgba(5,3,10,.50) 100%),
    linear-gradient(90deg,transparent 42%,var(--tint,rgba(123,47,247,.55)) 100%),
    var(--ink2);
  border:1px solid var(--line);border-radius:18px;
  padding:15px 15px 15px 60px;margin-bottom:10px;overflow:hidden;
  transition:border-color .2s;
}
.pack:active{border-color:rgba(164,114,255,.45)}
.pack[data-pack="decouverte"]{--tint:rgba(123,47,247,.55)}
.pack[data-pack="sensation"]{--tint:rgba(225,29,72,.55)}
.pack[data-pack="culture"]{--tint:rgba(232,184,75,.55)}
.pack[data-pack="dj"]{--tint:rgba(47,224,200,.55)}
.pack[data-pack="expert"]{--tint:rgba(164,114,255,.55)}
.pack[data-pack="mindset"]{--tint:rgba(76,110,245,.55)}
.pack[data-pack="evokeez"]{--tint:rgba(20,200,160,.55)}
.pack[data-pack="pionniers"]{--tint:rgba(201,138,46,.55)}
.pack[data-pack="galactic"]{--tint:rgba(147,51,234,.55)}
.pack .emo{position:absolute;left:15px;top:15px;font-size:26px;line-height:1}
.pack .ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pack h3{font-size:16px}
.pack .lvl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet-soft)}
.pack p{font-size:12.5px;margin:5px 0 8px;line-height:1.4}
.pack .meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.pack .mastery{margin-left:auto;color:var(--gold)}
.pack.locked{opacity:.5}
.pack.locked .meta{color:var(--rasp)}
.pack.done{border-color:rgba(232,184,75,.4)}

/* ---------- décompte de temps (signature) ---------- */
.count{
  display:flex;align-items:flex-end;gap:5px;height:22px;margin-bottom:6px;
}
.count b{
  flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.10);
  transition:height .25s ease,background .25s ease;
}
.count b.past{background:linear-gradient(90deg,var(--violet),var(--violet-soft))}
.count b.now{height:16px;background:var(--gold);box-shadow:0 0 12px rgba(232,184,75,.55)}
.count-lbl{
  display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--muted);letter-spacing:.08em;margin-bottom:18px;
}

/* ---------- quiz ---------- */
.q-mod{
  display:inline-block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--turq);border:1px solid rgba(47,224,200,.3);border-radius:999px;
  padding:4px 10px;margin-bottom:12px;
}
.q-text{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.24;margin-bottom:6px;letter-spacing:-.01em}
.q-hint{font-size:11.5px;color:var(--gold);margin-bottom:14px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--ink2);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;min-height:52px;line-height:1.35;
  transition:border-color .16s,background .16s;
}
.opt .tick{
  flex:0 0 20px;width:20px;height:20px;border-radius:7px;margin-top:1px;
  border:1.5px solid rgba(164,114,255,.4);display:grid;place-items:center;
  font-size:11px;color:transparent;transition:.16s;
}
.opt.sel{border-color:var(--violet-soft);background:rgba(123,47,247,.14)}
.opt.sel .tick{background:var(--violet);border-color:var(--violet);color:#fff}
.opt.right{border-color:var(--turq);background:rgba(47,224,200,.13)}
.opt.right .tick{background:var(--turq);border-color:var(--turq);color:#04231e}
.opt.wrong{border-color:var(--rasp);background:rgba(225,29,72,.12)}
.opt.wrong .tick{background:var(--rasp);border-color:var(--rasp);color:#fff}
.opt[disabled]{pointer-events:none}
.explain{
  border-radius:14px;padding:14px;margin:12px 0 4px;
  background:rgba(232,184,75,.07);border:1px solid rgba(232,184,75,.24);
  font-size:13.5px;line-height:1.5;
}
.explain b{display:block;font-family:var(--display);font-size:13px;margin-bottom:5px;letter-spacing:.02em}
.explain.ko{background:rgba(225,29,72,.07);border-color:rgba(225,29,72,.26)}
.src.kind{color:var(--violet-soft);border-top-color:rgba(164,114,255,.22)}
.src.warn{color:var(--rasp);border-top-color:rgba(225,29,72,.28)}
.src{display:block;margin-top:9px;padding-top:8px;border-top:1px solid rgba(232,184,75,.2);
     font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

/* ---------- cartes culturelles ---------- */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{
  position:relative;border-radius:14px;padding:13px;min-height:112px;
  background:
    linear-gradient(165deg,rgba(123,47,247,.22),rgba(11,6,22,.80) 62%),
    var(--ink2);
  border:1px solid rgba(232,184,75,.34);
  display:flex;flex-direction:column;
}
.ccard .emo{font-size:19px;margin-bottom:6px}
.ccard h3{font-size:13.5px;margin-bottom:5px}
.ccard p{font-size:10.5px;line-height:1.4;margin:0;color:var(--muted)}
.ccard .from{margin-top:auto;padding-top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.ccard{padding-right:38px}
.share-btn{
  position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:9px;
  border:1px solid rgba(232,184,75,.32);background:rgba(232,184,75,.10);
  color:var(--gold);font-size:14px;line-height:1;display:grid;place-items:center;
}
.share-btn:active{background:rgba(232,184,75,.24)}
.badge-row{display:flex;flex-wrap:wrap;gap:8px}
.badge{
  display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
  background:rgba(123,47,247,.13);border:1px solid rgba(164,114,255,.34);
  font-size:12px;white-space:nowrap;
}
.badge b{font-size:13px;color:var(--violet-soft)}
.badge i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
         text-transform:uppercase;color:var(--muted)}
.badge.gold{background:rgba(232,184,75,.12);border-color:rgba(232,184,75,.42)}
.badge.gold b{color:var(--gold)}
.streak{
  margin:-6px 0 14px;font-size:12px;color:var(--muted);text-align:center;
}
.streak b{color:var(--gold);font-family:var(--mono)}
.empty{
  text-align:center;padding:38px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);
}
.empty span{display:block;font-size:34px;margin-bottom:10px;opacity:.5}

/* ---------- résultats ---------- */
.score-ring{
  width:132px;height:132px;margin:6px auto 16px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--gold) var(--pct,0%),rgba(255,255,255,.07) 0);
}
.score-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink2)}
.score-ring div{position:relative;text-align:center}
.score-ring b{display:block;font-family:var(--mono);font-size:34px;line-height:1;color:var(--gold)}
.score-ring span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.recap{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.recap .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:6px}
.recap .dot.ok{background:var(--turq)} .recap .dot.ko{background:var(--rasp)}
.recap p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:60;
  max-width:88%;padding:11px 16px;border-radius:12px;font-size:13px;text-align:center;
  background:rgba(19,12,34,.97);border:1px solid rgba(164,114,255,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.report{
  display:block;margin-top:10px;font-size:11.5px;color:var(--muted);

k"],"k":"Slowed-down kuduro","e":"This is a very common mix-up. Several sources trace its origin to kuduro slowed to around 80-100 BPM, not to kizomba.","s":"Meu Semba · Rate Your Music · S-dances"},"n":"fait"},{"i":"s015","p":"sensation","m":"Tarraxinha","t":"single","q":"Quelle province angolaise est citée comme berceau de la tarraxinha ?","o":["Benguela","Luanda","Huambo","Cabinda"],"c":[0],"k":"Benguela","e":"À ses débuts, la tarraxinha a été critiquée en Angola pour son caractère jugé trop sensuel.","s":"Wikipédia","en":{"m":"Tarraxinha","q":"Which Angolan province is cited as the birthplace of tarraxinha?","o":["Benguela","Luanda","Huambo","Cabinda"],"k":"Benguela","e":"In its early days, tarraxinha was criticised in Angola for being too sensual.","s":"Wikipedia"},"n":"fait"},{"i":"s016","p":"pionniers","m":"DJs","t":"single","q":"DJ Znobia est cité parmi les pionniers de quel univers sonore ?","o":["La tarraxinha et les productions électroniques angolaises","Le semba acoustique","Le zouk antillais","La morna capverdienne"],"c":[0],"k":"DJ Znobia","e":"Son nom revient avec ceux de DJ Massacres, DJ Nervoso et DJ N.K. dans la diffusion de ces sons entre Luanda et la périphérie de Lisbonne.","s":"Rate Your Music · Meu Semba","en":{"m":"DJs","q":"DJ Znobia is cited among the pioneers of which sound world?","o":["Tarraxinha and Angolan electronic production","Acoustic semba","Antillean zouk","Cape Verdean morna"],"k":"DJ Znobia","e":"His name appears alongside DJ Massacres, DJ Nervoso and DJ N.K. in spreading these sounds between Luanda and the outskirts of Lisbon.","s":"Rate Your Music · Meu Semba"},"n":"fait"},{"i":"s017","p":"expert","m":"Tarraxo","t":"single","q":"Où la musique tarraxo apparaît-elle au début des années 2010 ?","o":["À Lisbonne, dans les communautés afro-portugaises","À Luanda","À Paris","À Rotterdam"],"c":[0],"k":"Tarraxo","e":"DJ BeBeDeRa et DJ Matabaya Moreira sont cités parmi les pionniers. Le tarraxo est donc largement une histoire européen 10","e":"Les versions divergent sur les personnes, beaucoup moins sur le lieu et la période.","s":"Wikipédia · The Kiz Lab","en":{"m":"Urban Kiz","q":"What do the different Urban Kiz accounts agree on most?","o":["A development in Paris in the 2010s and a name settled around 2015","A birth in Luanda in the 1990s","A creation in Cape Verde","An origin in carnival semba"],"k":"Paris, the 2010s","e":"The versions diverge on the people, far less on the place and the period.","s":"Wikipedia · The Kiz Lab"},"n":"fait"},{"i":"s020","p":"expert","m":"Urban Kiz","t":"multi","q":"Avant que le nom « Urban Kiz » ne s'impose, quels noms ont circulé pour ce style ?","o":["Kizomba 2.0","New style kizomba","Kizomba fusion","Semba urbain"],"c":[0,1,2],"k":"Noms transitoires","e":"Aucun consensus n'existait sur le nom. Le besoin d'une identité distincte de la kizomba est justement ce qui a poussé à en choisir un.","s":"Wikipédia","en":{"m":"Urban Kiz","q":"Before the name \"Urban Kiz\" took hold, which names circulated for this style?","o":["Kizomba 2.0","New style kizomba","Kizomba fusion","Urban semba"],"k":"Interim names","e":"There was no consensus on the name. The need for an identity distinct from kizomba is precisely what pushed people to choose one.","s":"Wikipedia"},"n":"fait"},{"i":"s021","p":"culture","m":"PALOP","t":"multi","q":"Quels genres sont traditionnellement capverdiens ?","o":["Morna","Coladeira","Funaná","Semba"],"c":[0,1,2],"k":"Genres capverdiens","e":"Le semba est angolais. Confondre les répertoires capverdiens et angolais est l'erreur la plus fréquente sur les scènes européennes.","s":"Kizombalove · Wikipédia","en":{"m":"PALOP","q":"Which genres are traditionally Cape Verdean?","o":["Morna","Coladeira","Funaná","Semba"],"k":"Cape Verdean genres","e":"Semba is Angolan. Mixing up Cape Verdean and Angolan repertoires is the most common mistake on European scenes.","s":"Kizombalove · Wikipedia"},"n":"fait"},{"i":"s022","p":"culture","m":"Premiers pièges","t":"single","q":"Pourquoi beaucoup de gens croient-ils à tort que la kizomba vient du Cap-Vert ?","o":["Parce que des artistes et producteurs capverdiens occupent une grande place dans sa production actuelle","Parce que le mot kizomba est capverdien","Parce que la danse a été codifiée à Praia","Parce que Kassav' était capverdien"],"c":[0],"k":"Angola, pas Cap-Vert","e":"Le rayonnement capverdien est réel dans la production musicale contemporaine. Il ne déplace pas l'origine, qui reste angolaise.","s":"Kizombalove","en":{"m":"Early traps","q":"Why do so many people wrongly believe kizomba comes from Cape Verde?","o":["Because Cape Verdean artists and producers hold a large place in its current production","Because the word kizomba is Cape Verdean","Because the dance was codified in Praia","Because Kassav' were Cape Verdean"],"k":"Angola, not Cape Verde","e":"Cape Verdean influence in contemporary music production is real. It does not move the origin, which remains Angolan.","s":"Kizombalove"},"n":"fait"},{"i":"s023","p":"galactic","m":"Débats","t":"single","q":"En Angola, quel terme est parfois employé pour désigner la danse pratiquée sur la musique kizomba ?","o":["Passada","Tarraxinha","Kuduro","Kabetula"],"c":[0],"k":"Passada","e":"Certaines voix angolaises soutiennent qu'il n'existe pas de « danse kizomba » à proprement parler, mais des pas de semba adaptés. Le débat reste ouvert et mérite d'être connu.","s":"Bom Dia Kizomba","en":{"m":"Debates","q":"In Angola, which term is sometimes used for the dance done to kizomba music?","o":["Passada","Tarraxinha","Kuduro","Kabetula"],"k":"Passada","e":"Some Angolan voices argue there is no \"kizomba dance\" as such, only adapted semba steps. The debate is open and worth knowing about.","s":"Bom Dia Kizomba"},"n":"fait"},{"i":"s024","p":"galactic","m":"Débats","t":"single","q":"Un pratiquant affirme : « La kizomba vient uniquement du zouk. » Quelle réponse est la plus solide ?","o":["C'est incomplet : il faut aussi parler de l'An /* ---------- stockage protégé (correctif 3) ------------------------------- */
function read(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null || raw === "") return fallback;
    const parsed = JSON.parse(raw);
    return parsed === null || parsed === undefined ? fallback : parsed;
  }catch(e){ return fallback; }
}
function write(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ toast(t("saved_fail")); return false; }
}

LANG = (() => {
  const saved = read(K.lang, null);
  if(saved === "fr" || saved === "en") return saved;
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || "fr").toLowerCase();
  return nav.startsWith("fr") ? "fr" : "en";
})();

  pack:null, queue:[], idx:0, picked:[], done:false, ok:false,

};

/* ---------- utilitaires -------------------------------------------------- */
function shuffle(list){                       // Fisher-Yates
  const out = list.slice();
  for(let i = out.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function levelOf(xp){ return LEVELS.slice().reverse().find(l => xp >= l.min) || LEVELS[0]; }
function nextLevelOf(xp){ return LEVELS.find(l => l.min > xp) || null; }
function esc(str){ return String(str).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function packOf(id){ return PACKS.find(p => p.id === id); }
function poolOf(id){ return QUESTIONS.filter(q => q.p === id); }
function masteryOf(id){
  const pool = poolOf(id);
  if(!pool.length) return 0;
  return Math.round(100 * pool.filter(q => S.seen.includes(q.i)).length / pool.length);
}

function badgesOf(){
  return PACKS.map(p => {
    const m = masteryOf(p.id);
    const tier = BADGE_TIERS.filter(t => m >= t.min).pop();
    return tier ? {pack:p, tier, m} : null;
  }).filter(Boolean);
}

/* Date LOCALE. toISOString() renvoie l'heure UTC : en France l'été, le quiz
   du jour changeait à 2 h du matin au lieu de minuit. */
function todayKey(d = new Date()){
  return d.getFullYear() + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}

function registerDaily(){
  const today = todayKey();
  if(S.daily.last === today) return;
  const yesterday = todayKey(new Date(Date.now() - 86400000));
  S.daily.streak = (S.daily.last === yesterday) ? S.daily.streak + 1 : 1;
  S.daily.last = today;
  S.daily.best = Math.max(S.daily.best, S.daily.streak);
  write(K.daily, S.daily);
}

/* CORRECTIF 1 — les options sont réellement remélangées à chaque partie.
   L'ancienne version figeait la position de la bonne réponse via l'ID.      */
function dealQuestion(q){
  const pairs = q.o.map((text, i) => ({text, right: q.c.includes(i)}));
  const mixed = shuffle(pairs);
  return {
    ...q,
    o: mixed.map(p => p.text),
    c: mixed.map((p, i) => p.right ? i : -1).filter(i => i >= 0)
  };
}

/* CORRECTIF 5 — XP non farmable : plein tarif la première fois seulement.   */
function xpFor(q, right){
  if(!right) return 0;
  if(S.seen.includes(q.i)) return 2;
  return q.t === "multi" ? 16 : (q.p === "galactic" || q.p === "pionniers" ? 18 : 10);
}

function reportLink(q){
  const sujet = "Erreur signalee - " + q.i;
  const corps =
    "Question : " + q.q + "\n" +

    (q.s ? "Source affichee : " + q.s + "\n" : "Aucune source affichee\n") +
    "\nCe qui me semble faux :\n\n" +
    "\nMa source :\n\n";
  return "mailto:" + CONTACT +
         "?subject=" + encodeURIComponent(sujet) +
         "&body=" + encodeURIComponent(corps);
}

}

/* ---------- démarrage d'une session -------------------------------------- */
function startPack(id){
  const pack = packOf(id);
  if(!pack) return;
  if(S.xp < pack.unlock){
    toast(t("locked") + " " + (pack.unlock - S.xp) + " " + t("xp_left"));
    return go("packs");
  }
  const pool = poolOf(id);
  if(!pool.length) return toast(t("soon"));

  /* CORRECTIF 4 — on ne demande jamais plus de questions qu'il n'en existe.
     On sert d'abord celles jamais vues, pour que rejouer ait un intérêt.    */
  const unseen = shuffle(pool.filter(q => !S.seen.includes(q.i)));
  const rest   = shuffle(pool.filter(q =>  S.seen.includes(q.i)));
  const size   = Math.min(pack.size, pool.length);

  S.pack = pack;
  S.queue = unseen.concat(rest).slice(0, size).map(q => dealQuestion(tq(q)));
  S.idx = 0; S.picked = []; S.done = false; S.ok = false;
  S.score = 0; S.gained = 0; S.fresh = []; S.log = [];
  go("quiz");
}

function startDaily(){
  /* 5 questions, tirées de façon stable pour la journée en cours. */
  const day = todayKey();
  let seed = 0; for(const ch of day) seed = (seed * 31 + ch.charCodeAt(0)) % 100000;
  const sorted = QUESTIONS.slice().sort((a,b) => a.i.localeCompare(b.i));
  const picked = [];
  for(let n = 0; n < 5; n++){
    seed = (seed * 1103515245 + 12345) % 2147483647;
    const q = sorted[Math.abs(seed) % sorted.length];
    if(!picked.some(x => x.i === q.i)) picked.push(q); else n--;
  }
  S.pack = {id:"daily", title:"Quiz du jour", emoji:"☀️", size:5};
  S.queue = picked.map(q => dealQuestion(tq(q)));
  S.idx = 0; S.picked = []; S.done = false; S.ok = false;
  S.score = 0; S.gained = 0; S.fresh = []; S.log = [];
  go("quiz");
}

/* ---------- réponses ------------------------------------------------------ */
function pick(i){
  if(S.done) return;
  const q = S.queue[S.idx];
  if(q.t === "multi"){
    S.picked = S.picked.includes(i) ? S.picked.filter(x => x !== i) : S.picked.concat(i);
  }else{
    S.picked = [i];
  }
  render();
}

function validate(){
  if(S.done) return;
  if(!S.picked.length) return toast(t("pick_one"));
  const q = S.queue[S.idx];
  const right = S.picked.length === q.c.length && S.picked.slice().sort().every((v,k) => v === q.c.slice().sort()[k]);

  const gain = xpFor(q, right);
  S.done = true; S.ok = right; S.gained += gain;
  if(right) S.score++;

  if(gain){ S.xp += gain; write(K.xp, S.xp); }

  if(right && !S.seen.includes(q.i)){
    S.seen.push(q.i); write(K.seen, S.seen);
    if(q.k && !S.cards.some(c => c.title === q.k)){
      const card = {title:q.k, from:S.pack.title, emoji:S.pack.emoji, text:q.e};
      S.cards.push(card); write(K.cards, S.cards);
      S.fresh.push(card);
    }
  }

  S.log.push({q:q.q, right, mine:S.picked.map(i => q.o[i]), good:q.c.map(i => q.o[i]), why:q.e});
  render();
}

function next(){
  if(S.idx >= S.queue.length - 1){
    if(S.pack && S.pack.id === "daily") registerDaily();
    return go("results");
  }
  S.idx++; S.picked = []; S.done = false; S.ok = false;
  render();
  window.scrollTo({top:0,behavior:"instant"});
}

function resetAll(){
  if(!confirm(t("confirm_reset"))) return;
  try{ [K.xp,K.cards,K.seen].forEach(k => localStorage.removeItem(k)); }catch(e){}
  S.xp = 0; S.cards = []; S.seen = [];
  toast(t("reset_done"));
  go("home");
}

/* ---------- partage d'une carte ------------------------------------------
   Rend la carte en PNG 1080x1350 (format story) et passe par le partage
   natif du téléphone. Repli sur un téléchargement si l'appareil ne sait pas. */
function wrapText(ctx, text, maxWidth){
  const words = String(text).split(" ");
  const lines = []; let line = "";
  for(const w of words){
    const test = line ? line + " " + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines;
}

function drawLogo(ctx, cx, cy, r, w){
  const g = ctx.createLinearGradient(cx-r, cy-r, cx+r*0.3, cy+r);
  g.addColorStop(0, "#A472FF"); g.addColorStop(0.55, "#7B2FF7"); g.addColorStop(1, "#2FE0C8");
  ctx.strokeStyle = g; ctx.lineWidth = w; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(cx, cy, r, (83/180)*Math.PI, (7/180)*Math.PI + 2*Math.PI);
  ctx.stroke();
  const a = Math.PI/4;
  ctx.strokeStyle = "#E8B84B";
  ctx.beginPath();
  ctx.moveTo(cx + r*0.68*Math.cos(a), cy + r*0.68*Math.sin(a));
  ctx.lineTo(cx + r*1.5*Math.cos(a),  cy + r*1.5*Math.sin(a));
  ctx.stroke();
}

function shareCard(index){
  const c = S.cards[index];
  if(!c) return;
  /* On charge la texture dorée, mais on ne la rend jamais obligatoire :
     si elle manque ou traîne, la carte part quand même. */
  const tex  = new Image();
  const crest = new Image();
  let restants = 2, launched = false;
  const go = () => { if(launched) return; launched = true;
                     drawShare(c, tex.naturalWidth ? tex : null,
                                  crest.naturalWidth ? crest : null); };
  const un = () => { if(--restants <= 0) go(); };
  tex.onload = un; tex.onerror = un; tex.src = "share-bg.jpg";
  crest.onload = un; crest.onerror = un; crest.src = "logo-gold-512.png";
  setTimeout(go, 2000);
}

function drawShare(c, tex, crest){
  const W = 1080, H = 1350;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

  const bg = x.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#150a2b"); bg.addColorStop(0.55, "#0b0616"); bg.addColorStop(1, "#05030a");
  x.fillStyle = bg; x.fillRect(0, 0, W, H);

  if(tex){
    x.globalAlpha = 0.62;
    x.drawImage(tex, 0, 0, W, H);
    x.globalAlpha = 1;
    const veil = x.createRadialGradient(W/2, H/2, W*0.14, W/2, H/2, W*0.80);
    veil.addColorStop(0, "rgba(5,3,10,.80)");
    veil.addColorStop(1, "rgba(5,3,10,.18)");
    x.fillStyle = veil; x.fillRect(0, 0, W, H);
  }

  x.strokeStyle = "rgba(232,184,75,.55)"; x.lineWidth = 4;
  x.strokeRect(52, 52, W-104, H-104);

  x.textAlign = "center";
  x.fillStyle = "#2FE0C8";
  x.font = "600 26px 'Instrument Sans', system-ui, sans-serif";
  x.fillText(t("cult_card"), W/2, 190);

  x.font = "82px system-ui, sans-serif";
  x.fillText(c.emoji || "✦", W/2, 330);

  x.fillStyle = "#F4EFFF";
  x.font = "800 76px 'Bricolage Grotesque', system-ui, sans-serif";
  wrapText(x, c.title, W-220).slice(0,3).forEach((l,i) => x.fillText(l, W/2, 470 + i*88));

  x.fillStyle = "#B4A8D4";
  x.font = "400 34px 'Instrument Sans', system-ui, sans-serif";
  wrapText(x, c.text, W-240).slice(0,7).forEach((l,i) => x.fillText(l, W/2, 760 + i*52));

  x.fillStyle = "#E8B84B";
  x.font = "700 26px 'Space Mono', monospace";
  x.fillText(String(c.from || "Culture").toUpperCase(), W/2, H-268);

  if(crest){
    const t = 118;
    x.drawImage(crest, W/2 - t/2, H - 165 - t/2, t, t);
  } else {
    drawLogo(x, W/2, H-165, 34, 11);   // repli si l'emblème ne charge pas
  }

  x.fillStyle = "#7A6F95";
  x.font = "700 22px 'Space Mono', monospace";
  x.fillText("KIZOMBA URBAN QUIZ  ·  BY KIZFLOW STUDIO", W/2, H-92);

  cv.toBlob(async blob => {
    if(!blob) return toast("Image impossible à générer.");
    const file = new File([blob], "kizomba-urban-quiz.png", {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:c.title}); return; }
      catch(err){ if(err && err.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kizomba-urban-quiz.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast(t("card_saved"));
  }, "image/png");
}

/* ---------- écrans -------------------------------------------------------- */
function viewHome(){
  const lv = levelOf(S.xp), nx = nextLevelOf(S.xp);
  const pct = nx ? Math.min(100, Math.round(100 * (S.xp - lv.min) / (nx.min - lv.min))) : 100;
  const open = PACKS.filter(p => S.xp >= p.unlock).length;
  const doneToday = S.daily.last === todayKey();
  const streak = S.daily.streak;
  return `
  <section class="hero">
    <img class="crest" src="logo-round-512.png" alt="Kizomba Urban Quiz" width="512" height="512" loading="eager" />
    <p>${t("hero_p")}</p>
    <div class="tempo">
      <span class="tempo-lbl">85 BPM</span>
      <span class="tempo-track"></span>
      <span class="tempo-lbl">1·2·3·4</span>
    </div>
    <button class="btn gold" data-act="daily">${doneToday ? t("daily_again") : t("daily")}</button>
    ${streak > 0 ? `<p class="streak">${doneToday ? t("done_today") : t("todo_today")} · ${t("streak")} <b>${streak}</b> ${streak>1?t("days"):t("day")}${S.daily.best>streak?` · ${t("record")} ${S.daily.best}`:""}</p>` : ""}
    <div class="btn-row"><button class="btn ghost" data-act="packs">${t("pick_pack")}</button></div>
  </section>

  <div class="panel">
    <div class="level-row">
      <div class="level-badge">${lv.emoji}</div>
      <div style="flex:1;min-width:0">
        <div class="level-name">${tf(lv,"name")}</div>
        <div class="level-next">${nx ? `${t("to_next")} <b class="num">${nx.min - S.xp}</b> ${t("before")} ${tf(nx,"name")}` : t("maxed")}</div>
      </div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>

  <div class="stat-row">
    <div class="stat"><b>${S.seen.length}</b><span>${t("mastered")}</span></div>
    <div class="stat"><b>${S.cards.length}</b><span>${t("cards")}</span></div>
    <div class="stat"><b>${badgesOf().length}</b><span>${t("badges")}</span></div>
  </div>
  <p class="sig">by KizFlow Studio</p>`;
}

function viewPacks(){
  return `<p class="eyebrow">${t("packs_eyebrow")}</p><h2 style="margin-bottom:14px">${t("packs_title")}</h2>` +
  PACKS.map(p => {
    const locked = S.xp < p.unlock;
    const m = masteryOf(p.id);
    const pool = poolOf(p.id).length;
    return `<button class="pack ${locked?"locked":""} ${m===100?"done":""}" data-pack="${p.id}" ${locked?'aria-disabled="true"':""}>
      <span class="emo">${p.emoji}</span>
      <span class="ttl"><h3>${tf(p,"title")}</h3><span class="lvl">${tf(p,"lvl")}</span></span>
      <p>${tf(p,"desc")}</p>
      <span class="meta">
        ${locked ? `🔒 ${p.unlock} ${t("xp_needed")}` : `${Math.min(p.size,pool)} ${t("questions")} · ${pool} ${t("of_total")}`}
        ${!locked ? `<span class="mastery">${m===100?t("full"):m+" %"}</span>` : ""}
      </span>
    </button>`;
  }).join("");
}

function viewQuiz(){
  const q = S.queue[S.idx];
  if(!q){ return `<div class="empty"><span>◇</span>${t("empty_session")}</div>`; }
  const beats = S.queue.map((_,i) => `<b class="${i < S.idx ? "past" : i === S.idx ? "now" : ""}"></b>`).join("");
  return `
  <div class="count">${beats}</div>
  <div class="count-lbl"><span>${S.pack.emoji} ${tf(S.pack,"title")}</span><span>${S.idx+1} / ${S.queue.length}</span></div>

  <span class="q-mod">${esc(q.m)}</span>
  <div class="q-text">${esc(q.q)}</div>
  ${q.t === "multi" ? `<div class="q-hint">${t("multi")}</div>` : ""}

  ${q.o.map((text,i) => {
    let cls = "";
    if(S.done){
      if(q.c.includes(i)) cls = "right";
      else if(S.picked.includes(i)) cls = "wrong";
    }else if(S.picked.includes(i)) cls = "sel";
    return `<button class="opt ${cls}" data-opt="${i}" ${S.done?"disabled":""}>
      <span class="tick">${S.done ? (q.c.includes(i) ? "✓" : (S.picked.includes(i) ? "✕" : "")) : "✓"}</span>
      <span>${esc(text)}</span>
    </button>`;
  }).join("")}

  ${S.done ? `<div class="explain ${S.ok?"":"ko"}">
      <b>${S.ok ? t("good") : t("bad")}</b>${esc(q.e)}${q.n === "fait"
        ? (q.s ? `<span class="src">${t("source")} · ${esc(q.s)}</span>`
               : `<span class="src warn">${t("n_nosrc")}</span>`)
        : `<span class="src kind">${t("n_" + q.n)}</span>`}
      <a class="report" href="${reportLink(q)}">${t("report")}</a>
    </div>` : ""}

  ${S.done
    ? `<button class="btn" data-act="next">${S.idx >= S.queue.length-1 ? t("see_result") : t("next_q")} →</button>`
    : `<button class="btn" data-act="validate" ${S.picked.length?"":"disabled"}>${t("validate")}</button>`}
  <div class="btn-row"><button class="btn ghost" data-act="packs">${t("quit")}</button></div>`;
}

function viewResults(){
  const pct = Math.round(100 * S.score / Math.max(1,S.queue.length));
  return `
  <div class="skin skin-results">
    <p class="eyebrow">${S.pack.emoji} ${tf(S.pack,"title")}</p>
    <div class="score-ring" style="--pct:${pct}%"><div><b>${S.score}<span style="font-size:17px;color:var(--muted)">/${S.queue.length}</span></b><span>${t("score")}</span></div></div>
  </div>

  <div class="stat-row">
    <div class="stat"><b>+${S.gained}</b><span>${t("xp_won")}</span></div>
    <div class="stat"><b>${S.fresh.length}</b><span>${t("cards")}</span></div>
    <div class="stat"><b>${pct}%</b><span>${t("success")}</span></div>
  </div>

  ${S.fresh.length ? `<div class="panel">
    <p class="eyebrow" style="margin-bottom:10px">${t("new_cards")}</p>
    <div class="cards-grid">${S.fresh.map(c => ccard(c)).join("")}</div>
  </div>` : ""}

  <div class="panel">
    <p class="eyebrow" style="margin-bottom:4px">${t("recap")}</p>
    ${S.log.map(l => `<div class="recap">
      <span class="dot ${l.right?"ok":"ko"}"></span>
      <div><div>${esc(l.q)}</div><p>${l.right ? "✓ " + esc(l.good.join(" · ")) : "→ " + esc(l.good.join(" · "))}</p></div>
    </div>`).join("")}
  </div>

  <button class="btn" data-act="replay">${t("replay")}</button>
  <div class="btn-row">
    <button class="btn ghost" data-act="packs">${t("nav_packs")}</button>
    <button class="btn ghost" data-act="cards">${t("my_cards")}</button>
  </div>`;
}

function ccard(c, index){
  return `<article class="ccard">
    <div class="emo">${c.emoji||"✦"}</div>
    <h3>${esc(c.title)}</h3>
    <p>${esc(String(c.text).slice(0,96))}${String(c.text).length>96?"…":""}</p>
    <div class="from">${esc(c.from||"Culture")}</div>
    ${index === undefined ? "" : `<button class="share-btn" data-share="${index}" aria-label="Partager la carte ${esc(c.title)}">↗</button>`}
  </article>`;
}

function viewCards(){
  if(!S.cards.length){
    return `<p class="eyebrow">Collection</p><h2 style="margin-bottom:14px">Mes cartes</h2>
    <div class="empty"><span>✦</span>${t("no_card")}</div>
    <div class="btn-row"><button class="btn" data-act="packs">${t("start")}</button></div>`;
  }
  const badges = badgesOf();
  return `
  <div class="skin skin-cards">
    <p class="eyebrow">${S.cards.length} ${S.cards.length>1?t("cardp"):t("card")} ${S.cards.length>1?t("unlockeds"):t("unlocked")}</p>
    <h2>${t("collection")}</h2>
  </div>

  <div class="panel">
    <p class="eyebrow" style="margin-bottom:10px">${t("badge_title")}</p>
    ${badges.length
      ? `<div class="badge-row">${badges.map(b => `<span class="badge ${b.tier.min===100?"gold":""}">
            <b>${b.tier.emoji}</b>${esc(tf(b.pack,"title"))}<i>${b.tier.label}</i></span>`).join("")}</div>`
      : `<p style="font-size:13px;margin:0">${t("no_badge")}</p>`}
  </div>

  <div class="cards-grid">${S.cards.map((c,i) => ccard(c,i)).join("")}</div>
  <div class="btn-row"><button class="btn danger" data-act="reset">${t("reset")}</button></div>`;
}

function viewInfos(){
  return `<p class="eyebrow">${t("infos_eyebrow")}</p>
  <h2 style="margin-bottom:14px">${t("infos_title")}</h2>
  <div class="panel">
    <h3 style="margin-bottom:8px">${t("does_t")}</h3>
    <p style="font-size:13.5px">${t("does_b")}</p>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:8px">${t("not_t")}</h3>
    <p style="font-size:13.5px">${t("not_b")}</p>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:8px">${t("wrong_t")}</h3>
    <p style="font-size:13.5px">${t("wrong_b")}</p>
    <a class="btn ghost" style="text-decoration:none" href="mailto:${CONTACT}?subject=${encodeURIComponent("Kizomba Urban Quiz - remarque")}">${t("write_us")}</a>
  </div>
  <div class="stat-row">
    <div class="stat"><b>${QUESTIONS.length}</b><span>${t("questions")}</span></div>
    <div class="stat"><b>${PACKS.length}</b><span>${t("nav_packs")}</span></div>
    <div class="stat"><b>${new Set(QUESTIONS.map(q=>q.m)).size}</b><span>${t("themes")}</span></div>
  </div>
  <p class="sig">by KizFlow Studio</p>`;
}

/* ---------- rendu --------------------------------------------------------- */
function render(){
  document.body.dataset.page = S.page;
  const lv = levelOf(S.xp);
  document.getElementById("xpVal").textContent = S.xp;
  document.getElementById("lvlEmo").textContent = lv.emoji;
  const view = document.getElementById("view");
  view.innerHTML =
    S.page === "home"    ? viewHome()    :
    S.page === "packs"   ? viewPacks()   :
    S.page === "quiz"    ? viewQuiz()    :
    S.page === "results" ? viewResults() :
    S.page === "cards"   ? viewCards()   : viewInfos();
}

document.getElementById("view").addEventListener("click", e => {
  const opt = e.target.closest("[data-opt]");
  if(opt) return pick(Number(opt.dataset.opt));
  const pk = e.target.closest("[data-pack]");
  if(pk) return startPack(pk.dataset.pack);
  const sh = e.target.closest("[data-share]");
  if(sh) return shareCard(Number(sh.dataset.share));
  const act = e.target.closest("[data-act]");
  if(!act) return;
  const a = act.dataset.act;
  if(a === "daily")    return startDaily();
  if(a === "packs")    return go("packs");
  if(a === "cards")    return go("cards");
  if(a === "validate") return validate();
  if(a === "next")     return next();
  if(a === "reset")    return resetAll();
  if(a === "replay")   return S.pack.id === "daily" ? startDaily() : startPack(S.pack.id);
});

document.getElementById("langBtn").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if(b) setLang(b.dataset.lang);
});

/* on applique la langue détectée avant le premier rendu */
document.documentElement.lang = LANG;
 document.documentElement.setAttribute("translate","no");
document.getElementById("sndBtn").setAttribute("aria-label", t("sound"));
document.querySelectorAll("#nav button em").forEach(el =>
  el.textContent = t("nav_" + el.parentElement.dataset.go));
document.querySelectorAll("#langBtn button").forEach(b =>
  b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

go("home");
</script>
